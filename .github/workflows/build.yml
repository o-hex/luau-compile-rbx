name: Build luau-compile-rbx

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aarch64:
    name: Build aarch64 (Linux / Android static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-aarch64-linux-gnu

      - name: Clone Luau 0.744
        run: |
          git clone --depth 1 --branch 0.744 https://github.com/luau-lang/luau.git luau-src

      - name: Apply Roblox Bytecode Encoder patch
        run: |
          cd luau-src
          patch -p1 < ../patches/roblox_encoder.patch

      - name: Configure CMake (aarch64 static)
        run: |
          cmake -B build -S luau-src \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_CLI=ON

      - name: Build Luau.Compile.CLI
        run: |
          cmake --build build --target Luau.Compile.CLI -j$(nproc)
          mv build/luau-compile luau-compile-rbx-linux-arm64
          chmod +x luau-compile-rbx-linux-arm64

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: luau-compile-rbx-linux-arm64
          path: luau-compile-rbx-linux-arm64

  build-x86_64:
    name: Build x86_64 (Linux static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Clone Luau 0.744
        run: |
          git clone --depth 1 --branch 0.744 https://github.com/luau-lang/luau.git luau-src

      - name: Apply Roblox Bytecode Encoder patch
        run: |
          cd luau-src
          patch -p1 < ../patches/roblox_encoder.patch

      - name: Configure CMake (x86_64 static)
        run: |
          cmake -B build -S luau-src \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DLUAU_BUILD_TESTS=OFF \
            -DLUAU_BUILD_CLI=ON

      - name: Build Luau.Compile.CLI
        run: |
          cmake --build build --target Luau.Compile.CLI -j$(nproc)
          mv build/luau-compile luau-compile-rbx-linux-x86_64
          chmod +x luau-compile-rbx-linux-x86_64

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: luau-compile-rbx-linux-x86_64
          path: luau-compile-rbx-linux-x86_64

  release:
    name: Create GitHub Release
    needs: [build-aarch64, build-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Inspect artifacts
        run: |
          ls -la artifacts/*

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.744-rbx1
          name: "luau-compile-rbx v0.744 (Roblox Dialect)"
          body: |
            ### Automated Native Luau Compiler with Roblox Opcode Remapping
            - Base: Luau `0.744` (Bytecode Version 14)
            - Cipher: `rbx_op = (std_op * 227) mod 256`
            - Static linkage for portable deployment on Linux / Android Termux ARM64.
          files: |
            artifacts/luau-compile-rbx-linux-arm64/luau-compile-rbx-linux-arm64
            artifacts/luau-compile-rbx-linux-x86_64/luau-compile-rbx-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
